version: "3.9"

services:
  # ─── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:4000
      - NEXT_PUBLIC_ML_SERVICE_URL=http://ml-service:8000
      - NEXT_PUBLIC_DEMO_MODE=true
    depends_on:
      - backend
    networks:
      - cyberpredict-net
    restart: unless-stopped

  # ─── Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DEMO_MODE=true
      - ML_SERVICE_URL=http://ml-service:8000
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - ml-service
    networks:
      - cyberpredict-net
    restart: unless-stopped

  # ─── ML Service ────────────────────────────────────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PREDICTOR_MODE=demo
      - WINDOW_MINUTES=5
    networks:
      - cyberpredict-net
    restart: unless-stopped

  # ─── Optional: PostgreSQL ──────────────────────────────────────────────────
  # Uncomment to add a local database
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: cyberpredict
  #     POSTGRES_PASSWORD: cyberpredict
  #     POSTGRES_DB: cyberpredict
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - cyberpredict-net

networks:
  cyberpredict-net:
    driver: bridge

